name: Alba’s Streetfood auf GitHub Pages veröffentlichen

on:
  push:
    branches: ["main"]
    paths:
      - "site-package-firstclass7-real-offers.tar.gz"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Prüfen und veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: First-Class-Website-Paket prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -f site-package-firstclass7-real-offers.tar.gz
          test -s site-package-firstclass7-real-offers.tar.gz
          tar -tzf site-package-firstclass7-real-offers.tar.gz >/dev/null

      - name: Website entpacken
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          tar -xzf site-package-firstclass7-real-offers.tar.gz -C _site
          test -f _site/index.html
          grep -q '20260726-firstclass7-real-offers' _site/index.html
          test -f _site/assets/images/offer-cevapcici-10-900.webp
          test -f _site/assets/images/offer-cevapcici-7-900.webp
          test -f _site/assets/images/offer-cevapcici-5-900.webp
          test -f _site/assets/images/offer-cevapcici-burger-900.webp
          test -f _site/assets/images/offer-wellenschnitt-pommes-900.webp
          touch _site/.nojekyll

      - name: Geschäftsdaten synchronisieren
        working-directory: _site
        run: node scripts/sync-business.mjs

      - name: Seitenstruktur prüfen
        working-directory: _site
        run: node scripts/audit-site.mjs

      - name: Satellitenkarte prüfen
        working-directory: _site
        run: node scripts/audit-map.mjs

      - name: HTML, CSS und JavaScript prüfen
        working-directory: _site
        run: node scripts/audit-harmony.mjs

      - name: Technische Abschlussprüfung
        working-directory: _site
        run: node scripts/audit-final.mjs

      - name: Offene Unternehmensangaben protokollieren
        working-directory: _site
        run: node scripts/validate-release.mjs

      - name: GitHub Pages aktivieren und vorbereiten
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Website-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
